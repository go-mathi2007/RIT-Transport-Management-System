<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusMate - Driver Portal Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modern.css') }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b3260 0%, #0d5ea6 50%, #1588ca 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            color: #10233f;
        }
        .driver-login-card {
            width: 440px;
            max-width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 38px 34px;
            box-shadow: 0 25px 60px rgba(7, 34, 73, 0.2);
            text-align: center;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #e8f2ff;
            padding: 7px 14px;
            border-radius: 30px;
            margin-bottom: 20px;
        }
        .brand-badge img {
            height: 24px;
            width: auto;
        }
        .brand-badge span {
            font-size: 12px;
            font-weight: 800;
            color: #075fce;
            letter-spacing: 0.5px;
        }
        .driver-icon {
            font-size: 46px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 26px;
            font-weight: 900;
            color: #082d5c;
            margin-bottom: 8px;
        }
        .sub {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            font-size: 14px;
            border: 1.5px solid #dbe7f3;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #075fce;
            box-shadow: 0 0 0 3px rgba(7, 95, 206, 0.15);
        }
        .btn-driver-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #075fce 0%, #064da6 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(7, 95, 206, 0.28);
            margin-top: 8px;
            transition: all 0.2s ease;
        }
        .btn-driver-login:hover {
            transform: translateY(-1px);
        }
        .btn-driver-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: left;
        }
        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .footer-note {
            margin-top: 22px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
        }
        .footer-note a {
            color: #075fce;
            font-weight: 700;
            text-decoration: none;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<main class="driver-login-card">
    <div class="brand-badge">
        <img src="{{ url_for('static', filename='rit-mark.png') }}" alt="RIT">
        <span>RIT TRANSPORT</span>
    </div>

    <div class="driver-icon">🚌</div>
    <h1>Driver Login</h1>
    <p class="sub">Sign in with your administrator-issued driver account to access your assigned bus and live GPS tracking.</p>

    <div id="loginAlert" class="alert-box alert-error"></div>

    <form id="driverLoginForm" onsubmit="handleDriverLogin(event)">
        <div class="form-group">
            <label for="driver_name">Driver Name or Mobile Number</label>
            <input type="text" id="driver_name" name="driver_name" required placeholder="Enter driver name or 10-digit mobile" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div style="position:relative;">
                <input type="password" id="password" name="password" required placeholder="Enter driver password" autocomplete="current-password" style="padding-right:42px;">
                <button type="button" onclick="togglePasswordVisibility('password', this)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px; color:#64748b;" aria-label="Toggle password">👁️</button>
            </div>
        </div>

        <button type="submit" class="btn-driver-login" id="driverLoginBtn">Sign In as Driver 🚌</button>
    </form>

    <div class="footer-note">
        <p>Driver accounts are managed directly by college administration.</p>
        <p style="margin-top:8px;"><a href="/">← Return to Main Portal</a></p>
    </div>
</main>

<script>
function togglePasswordVisibility(inputId, btn) {
    const inp = document.getElementById(inputId);
    if (!inp) return;
    if (inp.type === "password") {
        inp.type = "text";
        btn.textContent = "🔒";
        btn.title = "Hide password";
    } else {
        inp.type = "password";
        btn.textContent = "👁️";
        btn.title = "Show password";
    }
}

async function handleDriverLogin(e) {
    e.preventDefault();
    const alertBox = document.getElementById("loginAlert");
    const btn = document.getElementById("driverLoginBtn");
    const name = document.getElementById("driver_name").value.trim();
    const password = document.getElementById("password").value.trim();

    alertBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Verifying...";

    try {
        const response = await fetch("/driver/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ driver_name: name, password: password, phone: name })
        });
        const data = await response.json();
        if (response.ok && data.success) {
            btn.textContent = "✅ Login Successful";
            window.location.href = data.redirect || "/driver";
            return;
        }
        alertBox.textContent = data.message || "Invalid driver credentials.";
        alertBox.style.display = "block";
    } catch (err) {
        alertBox.textContent = "Unable to connect to the server. Make sure the backend is active.";
        alertBox.style.display = "block";
    } finally {
        btn.disabled = false;
        btn.textContent = "Sign In as Driver 🚌";
    }
}
</script>

</body>
</html>
